name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: Create the Android project
        run: npx cap add android
      - name: Add location + camera permissions
        run: python3 scripts/patch_manifest.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-outfit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK as a release (easy download on a phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-outfit-test.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest daily-outfit-test.apk --prerelease --title "Daily Outfit test build" --notes "Debug APK built from commit ${GITHUB_SHA::7}"
