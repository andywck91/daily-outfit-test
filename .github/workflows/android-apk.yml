name: Build Android debug APK
# NOT yet run: written without access to the Android SDK. See README ("Building the APK").
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: Create the Android project
        run: npx cap add android
      - name: Add location + camera permissions
        run: python3 scripts/patch_manifest.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: daily-outfit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
